name: Quick Test Build

# Manual only: on push this built exactly the same FOSS release APK as the
# "Build Release (foss)" job in build.yml, doubling the cost of every push.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease 2>&1 | tee build-output.log
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.test
          METROLIST_APP_NAME: Metrolist Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # Surfaces compiler errors as check annotations, which are readable
      # through the API even when the raw log archive is not.
      - name: Report build errors
        if: failure()
        run: |
          {
            grep -E '^e: ' build-output.log | head -30
            echo '--- tail ---'
            tail -60 build-output.log
          } > errors.txt
          # One annotation: GitHub caps how many it keeps per step.
          MSG=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error::${MSG}"

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/app-universal-test-release.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: app-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*

      # Also publishes the APK to a DRAFT pre-release so it can be downloaded
      # through the releases API. A draft is never returned by
      # /releases/latest, so the in-app updater cannot pick it up.
      - name: Publish test APK to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/foss/release/out/*.apk --clobber
          else
            gh release create "$TAG" --draft --prerelease \
              --title "Test build (not for release)" \
              --notes "Test-signed APK for manual checking. Draft on purpose." \
              app/build/outputs/apk/foss/release/out/*.apk
          fi
